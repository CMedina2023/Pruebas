name: Ejecutar prueba automatizada y actualizar Jira

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * *' # Programado para ejecutarse todos los días a medianoche

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip

    - name: Ejecutar prueba y actualizar Jira
      run: |
        python ./Jira.py --html=reports.html
        chmod 777  /home/runner/work/Pruebas/Pruebas/

    - name: Set output
      if: success() || failure()
      id: results
      run: echo "artifactPath=/home/runner/work/Pruebas/Pruebas/" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v3
      if: success() || failure()
      with:
        name: test-report
        path: ${{ steps.results.outputs.artifactPath }}
